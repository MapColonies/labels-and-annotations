suite: test selector labels
tests:
  - it: Should render selector labels correctly
    set:
      commonLabelsAndAnnotations:
        environment: development
        component: backend # Required for 'common-labels-and-annotations.labels'
        partOf: myApplication
        owner: infra
    asserts:
      # Check the selector labels on the Deployment
      - template: deployment.yaml
        equal:
          path: spec.selector.matchLabels["mapcolonies.io/environment"]
          value: development
      - template: deployment.yaml
        equal:
          path: spec.template.metadata.labels["mapcolonies.io/environment"]
          value: development
      # Check the selector labels on the Service
      - template: service.yaml
        equal:
          path: spec.selector["mapcolonies.io/environment"]
          value: development
      
  - it: selectorLabels should use global values if local are not set
    set:
      global:
        commonLabelsAndAnnotations:
          environment: production
      commonLabelsAndAnnotations:
        # environment: development # Intentionally not set locally
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      # Check the selector labels on the Deployment
      - template: deployment.yaml
        equal:
          path: spec.selector.matchLabels["mapcolonies.io/environment"]
          value: production # Should come from global
      - template: deployment.yaml
        equal:
          path: spec.template.metadata.labels["mapcolonies.io/environment"]
          value: production # Should come from global
      # Check the selector labels on the Service
      - template: service.yaml
        equal:
          path: spec.selector["mapcolonies.io/environment"]
          value: production # Should come from global

  - it: selectorLabels should use local values to override global
    set:
      global:
        commonLabelsAndAnnotations:
          environment: production
      commonLabelsAndAnnotations:
        environment: development # Local override
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      # Check the selector labels on the Deployment
      - template: deployment.yaml
        equal:
          path: spec.selector.matchLabels["mapcolonies.io/environment"]
          value: development # Local should override global
      - template: deployment.yaml
        equal:
          path: spec.template.metadata.labels["mapcolonies.io/environment"]
          value: development # Local should override global
      # Check the selector labels on the Service
      - template: service.yaml
        equal:
          path: spec.selector["mapcolonies.io/environment"]
          value: development # Local should override global
