suite: test labels
tests:
  - it: Should render labels correctly
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: development
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: backend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: myApplication
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: infra
      - equal:
          path: metadata.labels["mapcolonies.io/alloy-api-logs"]
          value: "false"
      - isNull:
          path: metadata.labels["mapcolonies.io/gis-domain"] # Not set by default

  - it: Should render labels with global overrides
    set:
      global:
        mcLabelsAndAnnotations:
          environment: production
      mcLabelsAndAnnotations:
        environment: development # This should override global.environment
        component: backend 
        partOf: myApplication
        owner: vector
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: development # Local overrides global
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: backend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: myApplication
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: vector

  - it: Should render labels with optional fields
    set:
      mcLabelsAndAnnotations:
        environment: stage
        component: frontend
        partOf: anotherApp
        owner: raster
        gisDomain: 3d
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: stage
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: frontend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: anotherApp
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: raster
      - equal:
          path: metadata.labels["mapcolonies.io/gis-domain"]
          value: 3d

  - it: Should set environment to undefined when not provided
    set:
      mcLabelsAndAnnotations:
        component: frontend
        partOf: anotherApp
        owner: raster
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: undefined
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: frontend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: anotherApp
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: raster

  - it: Should set log scraping label when enabled
    set:
      mcLabelsAndAnnotations:
        component: frontend
        partOf: avi
        owner: infra
        logScraping: true
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/alloy-api-logs"]
          value: "true"
