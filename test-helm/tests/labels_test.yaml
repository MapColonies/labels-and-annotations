suite: test labels
tests:
  - it: Should render labels correctly
    set:
      commonLabelsAndAnnotations:
        environment: development
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: development
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: backend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: myApplication
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: infra
      - isNull:
          path: metadata.labels["mapcolonies.io/release-version"] # Not set by default
      - isNull:
          path: metadata.labels["mapcolonies.io/gis-domain"] # Not set by default

  - it: Should render labels with global overrides
    set:
      global:
        commonLabelsAndAnnotations:
          environment: production
          component: global-backend
          partOf: global-app
          owner: common
      commonLabelsAndAnnotations:
        component: backend # This should override global.component
        partOf: myApplication # This should override global.partOf
        owner: vector # This should override global.owner
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: production # From global
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: backend # Local overrides global
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: myApplication # Local overrides global
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: vector # Local overrides global

  - it: Should render labels with optional fields
    set:
      commonLabelsAndAnnotations:
        environment: stage
        component: frontend
        partOf: anotherApp
        owner: raster
        releaseVersion: v1.2.3
        gisDomain: 3d
    asserts:
      - equal:
          path: metadata.labels["mapcolonies.io/environment"]
          value: stage
      - equal:
          path: metadata.labels["mapcolonies.io/component"]
          value: frontend
      - equal:
          path: metadata.labels["mapcolonies.io/part-of"]
          value: anotherApp
      - equal:
          path: metadata.labels["mapcolonies.io/owner"]
          value: raster
      - equal:
          path: metadata.labels["mapcolonies.io/release-version"]
          value: v1.2.3
      - equal:
          path: metadata.labels["mapcolonies.io/gis-domain"]
          value: 3d
