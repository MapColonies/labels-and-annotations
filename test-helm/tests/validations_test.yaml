suite: test validations
tests:
  - it: Should fail if partOf is missing
    set:
      mclabels:
        criticality: internal
        component: backend
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'partOf'"

  - it: Should fail if owner is missing
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: myApplication
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'owner'"

  - it: Should fail if component is missing
    set:
      mclabels:
        criticality: internal
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'component'"

  - it: Should fail if criticality is missing
    set:
      mclabels:
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'criticality'"

  - it: Should fail for invalid environment value
    set:
      mclabels:
        environment: "invalid-env"
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of 'development', 'stage', 'production'"

  - it: Should fail for invalid component value
    set:
      mclabels:
        environment: development
        criticality: internal
        component: "invalid-component"
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of 'frontend', 'backend', 'database', 'proxy-server', 'cache-server', 'infrastructure'"

  - it: Should fail for invalid owner value
    set:
      mclabels:
        environment: development
        criticality: internal
        component: backend
        partOf: myApplication
        owner: "invalid-owner"
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of 'vector', 'raster', '3d', 'app', 'dem', 'infra', 'common', 'automation'"

  - it: Should fail for invalid criticality value
    set:
      mclabels:
        environment: development
        criticality: "invalid-criticality"
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of 'internal', 'customer'"

  - it: Should fail for invalid gisDomain value
    set:
      mclabels:
        environment: development
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
        gisDomain: "invalid-gis"
    asserts:
      - failedTemplate:
          errorPattern: "value must be one of 'vector', 'raster', '3d', 'dem', 'terrain-analysis'"

  - it: Should fail if mclabels is missing locally AND globally
    set:
      global: {}
      # mclabels: {} # Intentionally missing locally
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'component'"

  - it: Should fail if partOf is empty
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: ""
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'partOf'"

  - it: Should list every invalid value in one error
    set:
      mclabels:
        criticality: internal
        component: "invalid-component"
        partOf: myApplication
    asserts:
      - failedTemplate:
          errorPattern: "missing property 'owner'\\n- at '/component': value must be one of"

  - it: Should fail for non-boolean logScraping
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
        logScraping: "yes"
    asserts:
      - failedTemplate:
          errorPattern: "at '/logScraping': must be a boolean"

  - it: Should fail if prometheus.enabled is missing
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
        prometheus:
          port: 8080
    asserts:
      - failedTemplate:
          errorPattern: "at '/prometheus': missing property 'enabled'"

  - it: Should fail for out-of-range prometheus.port
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
        prometheus:
          enabled: true
          port: 70000
    asserts:
      - failedTemplate:
          errorPattern: "at '/prometheus/port': must be an integer between 1 and 65535"

  - it: Should fail for prometheus.path without leading slash
    set:
      mclabels:
        criticality: internal
        component: backend
        partOf: myApplication
        owner: infra
        prometheus:
          enabled: true
          path: metrics
    asserts:
      - failedTemplate:
          errorPattern: "at '/prometheus/path': must be a string starting with '/'"
