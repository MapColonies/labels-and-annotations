suite: test validations
tests:
  - it: Should fail if environment is missing
    set:
      mcLabelsAndAnnotations:
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorMessage: "There is no environment key in mcLabelsAndAnnotations, globally or locally"

  - it: Should fail if partOf is missing
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: backend
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "partOf is required"

  - it: Should fail if owner is missing
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: backend
        partOf: myApplication
    asserts:
      - failedTemplate:
          errorPattern: "owner is required"

  - it: Should fail if component is missing
    set:
      mcLabelsAndAnnotations:
        environment: development
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "component is required"

  - it: Should fail for invalid environment value
    set:
      mcLabelsAndAnnotations:
        environment: "invalid-env"
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: 'environment must be one of the following: "development", "stage", "production"'

  - it: Should fail for invalid component value
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: "invalid-component"
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: 'component must be one of the following: "frontend", "backend", "database", "proxy-server", "cache-server", "infrastructure"'

  - it: Should fail for invalid owner value
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: backend
        partOf: myApplication
        owner: "invalid-owner"
    asserts:
      - failedTemplate:
          errorPattern: 'owner must be one of the following: "vector", "raster", "3d", "app", "dem", "infra", "common"'

  - it: Should fail for invalid gisDomain value
    set:
      mcLabelsAndAnnotations:
        environment: development
        component: backend
        partOf: myApplication
        owner: infra
        gisDomain: "invalid-gis"
    asserts:
      - failedTemplate: 
          errorPattern: 'gisDomain must be one of the following: "vector", "raster", "3d", "dem", "terrain-analysis"'

  - it: Should fail if mcLabelsAndAnnotations is missing locally AND globally
    set:
      global: {}
      # mcLabelsAndAnnotations: {} # Intentionally missing locally
    asserts:
      - failedTemplate:
          errorPattern: "values don't meet the specifications of the schema"
