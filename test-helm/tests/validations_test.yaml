suite: test validations
tests:
  - it: Should fail if environment is missing
    set:
      commonLabelsAndAnnotations:
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorMessage: "The required key 'environment' is missing in global.commonLabelsAndAnnotations"

  - it: Should fail if partOf is missing
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development
      commonLabelsAndAnnotations:
        component: backend
        owner: infra
    asserts:
      - failedTemplate:
          errorMessage: "There is no partOf key in commonLabelsAndAnnotations"

  - it: Should fail if owner is missing
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development    
      commonLabelsAndAnnotations:
        component: backend
        partOf: myApplication
    asserts:
      - failedTemplate:
          errorMessage: "There is no owner key in commonLabelsAndAnnotations"

  - it: Should fail if component is missing
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development    
      commonLabelsAndAnnotations:
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorMessage: "There is no component key in commonLabelsAndAnnotations"

  - it: Should fail for invalid environment value
    set:
      global:
        commonLabelsAndAnnotations:
          environment: "invalid-env"        
      commonLabelsAndAnnotations:
        component: backend
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "Provided: invalid-env"

  - it: Should fail for invalid component value
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development  
      commonLabelsAndAnnotations:
        component: "invalid-component"
        partOf: myApplication
        owner: infra
    asserts:
      - failedTemplate:
          errorPattern: "Provided: invalid-component."       

  - it: Should fail for invalid owner value
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development     
      commonLabelsAndAnnotations:
        component: backend
        partOf: myApplication
        owner: "invalid-owner"
    asserts:
      - failedTemplate:
          errorPattern: "Provided: invalid-owner"

  - it: Should fail if owner is defined in global.commonLabelsAndAnnotations
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development
          owner: "owner"
    asserts:
      - failedTemplate:
          errorPattern: "Forbidden key 'owner'"          

  - it: Should fail if component is defined in global.commonLabelsAndAnnotations
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development
          component: "component"
    asserts:
      - failedTemplate:
          errorPattern: "Forbidden key 'component'"

  - it: Should fail if partOf is defined in global.commonLabelsAndAnnotations
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development
          partOf: "partOf"
    asserts:
      - failedTemplate:
          errorPattern: "Forbidden key 'partOf'"

  - it: Should fail for invalid gisDomain value
    set:
      global:
        commonLabelsAndAnnotations:
          environment: development     
      commonLabelsAndAnnotations:
        component: backend
        partOf: myApplication
        owner: infra
        gisDomain: "invalid-gis"
    asserts:
      - failedTemplate: 
          errorPattern: "Provided: invalid-gis"

  - it: Should fail if commonLabelsAndAnnotations is missing locally AND globally
    set:
      global: {}
      # commonLabelsAndAnnotations: {} # Intentionally missing locally
    asserts:
      - failedTemplate:
          errorMessage: "There is no commonLabelsAndAnnotations key (locally or globally)"
